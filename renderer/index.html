<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Nano Studio</title>
  <link rel="stylesheet" href="core/styles.css">
  <link rel="stylesheet" href="core/notifications.css">
</head>
<body>
  <header id="toolbar">
    <div id="toolbarLeft" class="tb-group">
      <button id="mainMenuBtn" data-keymap-action="MainMenu" class="tb-icon main-menu-btn" title="Main Menu" data-i18n-title="Main Menu"></button>
      <button id="projectWidget" class="tb-btn project-widget" title="Projects" data-i18n-title="Projects"></button>
    </div>
    <div id="toolbarRight" class="tb-group">
      <div id="runWidget" class="run-widget"></div>
      <button id="searchBtn" data-keymap-action="SearchEverywhere" class="tb-icon search-btn" title="Search Everywhere" data-i18n-title="Search Everywhere"></button>
    </div>
  </header>

  <div id="main">
    <nav id="stripe">
      <div id="stripeTop" class="stripe-group"></div>
      <div class="spacer"></div>
      <div id="stripeBottom" class="stripe-group"></div>
      <button id="stripeMore" class="stripe-btn stripe-more"></button>
    </nav>

    <aside id="sidePanel">
      <div class="panel-header">
        <span id="sideTitle"></span>
        <span id="sideActions" class="panel-actions"></span>
      </div>
      <div id="sideBody"></div>
    </aside>
    <div id="sideSplitter" class="splitter v" data-target="sidePanel"></div>

    <section id="center">
      <div id="editorArea">
        <div id="editorGroups"></div>
        <div id="welcome">
          <div class="welcome-card">
            <div class="welcome-head">
              <span class="welcome-logo">Py</span>
              <div>
                <h1>Nano Studio</h1>
                <p data-i18n="A PyCharm-style Python IDE">A PyCharm-style Python IDE</p>
              </div>
            </div>
            <div class="welcome-actions">
              <button id="welcomeNew" class="welcome-action"><span class="welcome-action-icon" data-icon="newProject"></span><span data-i18n="New Project">New Project</span></button>
              <button id="welcomeOpen" class="welcome-action"><span class="welcome-action-icon" data-icon="openProject"></span><span data-i18n="Open">Open</span></button>
              <button id="welcomeVcs" class="welcome-action"><span class="welcome-action-icon" data-icon="fromVcs"></span><span data-i18n="Get from VCS">Get from VCS</span></button>
            </div>
            <div class="welcome-recent-title" data-i18n="Recent Projects">Recent Projects</div>
            <div id="welcomeRecent" class="welcome-recent"></div>
          </div>
        </div>
      </div>
      <div id="craftHost"></div>
      <div id="bottomSplitter" class="splitter h" data-target="bottom"></div>
      <section id="bottom">
        <div class="bottom-tabs">
          <div id="bottomTabs" class="bottom-tab-list"></div>
          <span class="spacer"></span>
          <span id="bottomActions" class="panel-actions"></span>
          <button id="hideBottomBtn" data-keymap-action="HideBottom" title="Hide" data-i18n-title="Hide">—</button>
        </div>
        <div id="bottomBody"></div>
      </section>
    </section>

    <div id="rightSplitter" class="splitter v hidden" data-target="rightPanel" data-grow="left"></div>
    <aside id="rightPanel" class="hidden">
      <div class="panel-header">
        <span id="rightTitle"></span>
        <span id="rightActions" class="panel-actions"></span>
      </div>
      <div id="rightBody"></div>
    </aside>
    <nav id="stripeRight">
      <div id="stripeRightTop" class="stripe-group"></div>
    </nav>
  </div>

  <footer id="status">
    <span id="statusPath"></span>
    <span class="spacer"></span>
    <span id="statusItems"></span>
    <span id="statusPos"></span>
    <span id="statusEncodingSlot"></span>
    <button id="statusInterp" class="status-interp" title="Python Interpreter" data-i18n-title="Python Interpreter"><span id="statusInterpLabel"></span></button>
    <select id="interpSelect" class="hidden" aria-hidden="true"></select>
  </footer>

  <div id="popup" class="hidden">
    <input id="popupIn">
    <div id="popupList"></div>
  </div>
  <div id="menuHost"></div>
  <div id="dialogHost"></div>

  <script src="core/diagnostics.js"></script>
  <script src="core/i18n.js"></script>
  <script src="core/icons.js"></script>
  <script src="core/icons-ui.js"></script>
  <script src="core/icons-extra.js"></script>
  <script src="core/theme.js"></script>
  <script src="core/python.js"></script>
  <script src="../node_modules/monaco-editor/min/vs/loader.js"></script>
  <script src="core/ide.js"></script>
  <script src="core/notifications.js"></script>
<script src="core/file-icons-data.js"></script>
<script src="core/file-icons.js"></script>
  <script src="core/editors.js"></script>
  <script src="core/project-wizard.js"></script>
  <script src="core/mainmenu.js"></script>
</body>
</html>
