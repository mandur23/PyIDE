<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Nano Studio</title>
  <link rel="stylesheet" href="core/chooser.css">
</head>
<body>
  <header class="chooser-head">
    <span id="chooserTitle" class="chooser-title"></span>
    <button id="chooserClose" class="chooser-close"></button>
  </header>
  <main class="chooser-cards">
    <button id="chooseCode" class="chooser-card" data-mode="code">
      <span class="chooser-icon" data-icon="code"></span>
      <span class="chooser-name"></span>
      <span class="chooser-sub"></span>
    </button>
    <button id="chooseCraft" class="chooser-card" data-mode="craft">
      <span class="chooser-icon" data-icon="minecraft"></span>
      <span class="chooser-name"></span>
      <span class="chooser-sub"></span>
    </button>
  </main>
  <script src="core/i18n.js"></script>
  <script src="core/icons.js"></script>
  <script src="core/icons-ui.js"></script>
  <script src="core/icons-extra.js"></script>
  <script src="core/chooser.js"></script>
</body>
</html>
