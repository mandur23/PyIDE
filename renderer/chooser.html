<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>Nano Studio</title>
  <link rel="stylesheet" href="core/chooser.css">
</head>
<body>
  <header class="chooser-bar">
    <svg class="chooser-logo" viewBox="0 0 256 256" aria-hidden="true">
      <defs>
        <linearGradient id="logoPlate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f3237"/><stop offset="1" stop-color="#191a1d"/></linearGradient>
        <linearGradient id="logoMark" gradientUnits="userSpaceOnUse" x1="60" y1="70" x2="196" y2="186"><stop offset="0" stop-color="#4c8dff"/><stop offset="1" stop-color="#5fd38a"/></linearGradient>
      </defs>
      <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#logoPlate)"/>
      <path d="M76 184V72L180 184V72" fill="none" stroke="url(#logoMark)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span id="chooserTitle" class="chooser-title"></span>
    <span id="chooserVersion" class="chooser-version"></span>
    <span class="chooser-gap"></span>
    <span id="chooserStatus" class="chooser-status" role="status"></span>
    <span id="chooserClock" class="chooser-clock"></span>
    <button id="chooserClose" class="chooser-close">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </header>
  <main class="chooser-hello">
    <h1 id="chooserAsk"></h1>
    <p id="chooserHint"></p>
  </main>
  <nav class="chooser-dock">
    <button id="chooseCode" class="chooser-card" data-mode="code">
      <span class="chooser-label"><span class="chooser-name"></span><span class="chooser-sub"></span></span>
      <svg class="chooser-icon" viewBox="0 0 256 256" aria-hidden="true">
        <defs><linearGradient id="codePlate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a9bff"/><stop offset="1" stop-color="#2a52d8"/></linearGradient></defs>
        <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#codePlate)"/>
        <path d="M102 82 52 128l50 46M154 82l50 46-50 46" fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M140 66 116 190" fill="none" stroke="#cfe0ff" stroke-width="16" stroke-linecap="round"/>
      </svg>
    </button>
    <button id="chooseCraft" class="chooser-card" data-mode="craft">
      <span class="chooser-label"><span class="chooser-name"></span><span class="chooser-sub"></span></span>
      <svg class="chooser-icon" viewBox="0 0 256 256" aria-hidden="true">
        <defs><linearGradient id="craftPlate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fe3a2"/><stop offset="1" stop-color="#1f9b63"/></linearGradient></defs>
        <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#craftPlate)"/>
        <path d="M128 54 206 96 128 138 50 96Z" fill="#7bd651"/>
        <path d="M50 96 128 138V206L50 164Z" fill="#8a5a33"/>
        <path d="M206 96 128 138V206L206 164Z" fill="#6c4526"/>
        <path d="M50 96 128 138V156L108 145 96 152 78 140 64 130 50 124Z" fill="#62bd3e"/>
        <path d="M206 96 128 138V156L146 146 160 154 178 140 192 132 206 122Z" fill="#4fa32f"/>
      </svg>
    </button>
    <span id="chooserSep" class="chooser-sep" hidden></span>
    <button id="chooseUpdate" class="chooser-update" hidden>
      <span id="chooserUpdateTip" class="chooser-label"></span>
      <span class="chooser-update-plate">
        <svg class="chooser-update-icon" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 7v23M13 20l11 11 11-11" fill="none" stroke="#2f6df0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9 40h30" stroke="#2f6df0" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <svg id="chooserRing" class="chooser-ring" viewBox="0 0 100 100" aria-hidden="true" hidden>
          <circle class="chooser-ring-back" cx="50" cy="50" r="40"/>
          <circle id="chooserRingBar" class="chooser-ring-bar" cx="50" cy="50" r="40" stroke-dasharray="251.3" stroke-dashoffset="251.3" transform="rotate(-90 50 50)"/>
        </svg>
        <span id="chooserBadge" class="chooser-badge">1</span>
      </span>
    </button>
  </nav>
  <script src="core/i18n.js"></script>
  <script src="core/chooser.js"></script>
</body>
</html>
