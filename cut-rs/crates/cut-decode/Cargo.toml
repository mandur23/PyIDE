[package]
name = "cut-decode"
description = "Decoding in Nano Studio Cut: H.264, HEVC and AAC through Windows Media Foundation decoder transforms, fed from cut-formats' sample tables (the native counterpart of renderer/features/cut/decoder.js)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cut-time = { path = "../cut-time" }
cut-formats = { path = "../cut-formats" }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Variant",
    "Win32_Storage_FileSystem",
] }
# Only for frames shared with the engine's wgpu device (DX12 interop): the version the engine and eframe build.
wgpu = "30.0.1"

[dev-dependencies]
png = "0.18"

[lints]
workspace = true
