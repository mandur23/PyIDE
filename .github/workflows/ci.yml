# Runs the verify suites that need no network, AI models, databases, Docker or WSL on Windows runners, split into six
# shards that run at once (verify/ci-shard.mjs spreads verify/ci-suites.json by each suite's measured seconds). A
# runner has an interactive desktop, so the suites run directly (verify/on-desktop.ps1 is for a desktop someone is
# working on). A shard's verify/out is uploaded when something in it fails.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (shard ${{ matrix.shard }} of 6)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      # The IDE's default interpreter is `py -3`, then `python`; both must be the 3.13 that has pytest.
      PY_PYTHON: '3.13'
      PY_PYTHON3: '3.13'
    defaults:
      run:
        shell: pwsh
    steps:
      # The checkout this repo is developed in has core.autocrlf=false; the runner's Git for Windows defaults to true,
      # which would give the fixtures CRLF line endings the suites compare against.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.11.0'
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: npm ci
        run: npm ci

      - name: Bundled tools (ruff, debugpy)
        run: npm run vendor

      - name: pytest for the default interpreter
        run: python -m pip install --disable-pip-version-check pytest

      # verify/rename-module.mjs (like verify/refactor.mjs) runs rope from this venv; it would make it itself.
      - name: rope venv
        id: ready
        run: |
          python -m venv verify/out/refactor-venv
          verify/out/refactor-venv/Scripts/python.exe -m pip install --disable-pip-version-check rope

      - name: suites of this shard
        timeout-minutes: 40
        run: node verify/ci-shard.mjs --shard ${{ matrix.shard }} --of 6

      - name: Upload verify/out
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: verify-out-shard-${{ matrix.shard }}
          path: |
            verify/out/
            !verify/out/refactor-venv/
          if-no-files-found: ignore
          retention-days: 14
