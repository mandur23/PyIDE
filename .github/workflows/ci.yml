# Runs the verify suites that need no network, AI models, databases, Docker or WSL on Windows runners, split into six
# shards that run at once (verify/ci-shard.mjs spreads verify/ci-suites.json by each suite's measured seconds). A
# runner has an interactive desktop, so the suites run directly (verify/on-desktop.ps1 is for a desktop someone is
# working on). A shard's verify/out is uploaded when something in it fails.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nano Studio Cut is the Rust program in cut-rs: its release exe is built (as scripts/release.mjs builds it for the
  # installer), the app is checked to start it (verify/cut-rust-launch.mjs --real; the shards run the same suite against
  # a stand-in), then the tests of the crates that need neither a GPU nor this PC's codecs run. The runner has no GPU
  # (wgpu draws on WARP, Direct3D 12's software adapter, where a frame can take longer than the tests wait) and neither
  # a VP9 encoder nor the HEVC Video Extension, so the tests of cut-decode, cut-engine, cut-export and cut-app (its
  # window draws through the engine) fail there for what the runner lacks. Those four run on a developer's PC before a
  # release (docs/development.md, the cut-rs gate).
  cut-rs:
    name: cut-rs (build, launch, cargo test)
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.11.0'
          cache: npm

      - name: npm ci
        run: npm ci

      # cut-rs/Cargo.toml's rust-version.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cut-rs -> target

      - name: cargo build --release -p cut-app
        run: cargo build --release --locked -p cut-app --manifest-path cut-rs/Cargo.toml

      - name: the app starts the built Cut
        timeout-minutes: 10
        run: node verify/cut-rust-launch.mjs --real

      - name: cargo test (the crates that need no GPU and no codecs)
        timeout-minutes: 45
        # The runner's TEMP is an 8.3 short name (RUNNER~1), which the tests' path comparisons do not expect.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: cargo test --workspace --exclude cut-app --exclude cut-engine --exclude cut-export --exclude cut-decode --locked --no-fail-fast --manifest-path cut-rs/Cargo.toml

      - name: Upload verify/out
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: verify-out-cut-rs
          path: verify/out/
          if-no-files-found: ignore
          retention-days: 14

  verify:
    name: verify (shard ${{ matrix.shard }} of 6)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      # The IDE's default interpreter is `py -3`, then `python`; both must be the 3.13 that has pytest.
      PY_PYTHON: '3.13'
      PY_PYTHON3: '3.13'
    defaults:
      run:
        shell: pwsh
    steps:
      # The checkout this repo is developed in has core.autocrlf=false; the runner's Git for Windows defaults to true,
      # which would give the fixtures CRLF line endings the suites compare against.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.11.0'
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: npm ci
        run: npm ci

      - name: Bundled tools (ruff, debugpy)
        run: npm run vendor

      - name: pytest for the default interpreter
        run: python -m pip install --disable-pip-version-check pytest

      # verify/rename-module.mjs (like verify/refactor.mjs) runs rope from this venv; it would make it itself.
      - name: rope venv
        id: ready
        run: |
          python -m venv verify/out/refactor-venv
          verify/out/refactor-venv/Scripts/python.exe -m pip install --disable-pip-version-check rope

      - name: suites of this shard
        timeout-minutes: 40
        run: node verify/ci-shard.mjs --shard ${{ matrix.shard }} --of 6

      - name: Upload verify/out
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: verify-out-shard-${{ matrix.shard }}
          path: |
            verify/out/
            !verify/out/refactor-venv/
          if-no-files-found: ignore
          retention-days: 14
